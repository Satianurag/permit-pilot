[project]
name = "permit-pilot-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.9.0",
  "uvicorn[standard]>=0.34.0",
  "starlette>=0.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["permit_pilot_mcp"]
