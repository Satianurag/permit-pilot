[project]
name = "permit-pilot-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "permit-pilot-core",
  "google-genai>=1.33.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["permit_pilot_api"]

[tool.uv.sources]
permit-pilot-core = { path = "../../packages/permit_pilot_core", editable = true }

[tool.hatch.metadata]
allow-direct-references = true
