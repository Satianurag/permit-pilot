[project]
name = "permit-pilot-orchestrator"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "google-adk>=1.25.0",
  "permit-pilot-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["permit_pilot"]

[tool.uv.sources]
permit-pilot-core = { path = "../../packages/permit_pilot_core", editable = true }

[tool.hatch.metadata]
allow-direct-references = true
