[project]
name = "permit-pilot-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "google-api-core>=2.25.0,<2.35.0",
  "google-auth>=2.14.1,<2.57.0",
  "google-cloud-core>=2.4.0,<2.7.0",
  "google-cloud-firestore>=2.28.1,<2.29.0",
  "google-cloud-dlp>=3.38.0",
  "google-cloud-workflows>=1.23.0",
  "httpx>=0.28.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "opentelemetry-exporter-gcp-trace>=1.6.0",
  "pydantic>=2.10.0,<3.0.0",
  "protobuf>=4.25.8,<7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["permit_pilot_core"]
