# GCP Cloud Workflows — calls API resume until 6 department steps complete.
main:
  params: [input]
  steps:
    - init:
        assign:
          - case_id: ${input.case_id}
          - api_base: ${input.api_base}
          - remaining: 6
          - step_response: {}
    - distribution_loop:
        switch:
          - condition: ${remaining <= 0}
            next: finish
          - condition: ${true}
            steps:
              - resume_department:
                  call: http.post
                  args:
                    url: ${api_base + "/api/cases/" + case_id + "/workflow/resume"}
                    auth:
                      type: OIDC
                  result: step_response
              - decrement:
                  assign:
                    - remaining: ${remaining - 1}
              - loop_again:
                  next: distribution_loop
    - finish:
        return: ${step_response}
